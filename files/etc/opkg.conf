# =============================================================================
#  opkg 全局配置（随固件内置）
#
#  说明: 官方源(ImmortalWrt 24.10)的 Packages.sig 可以正常校验; 但 iStoreOS 的
#        store / nas_luci / nas 三个源由未公开的 key 1d15e401c11b3e0f 签名,
#        本机只有 a56f16274c6d486b(仅能验证 all/compat), 因此启用签名会持续报
#        "Signature check failed"。
#
#        按使用习惯, 这里默认**注释掉** option check_signature(即不校验签名),
#        保证 `opkg update` / 软件包界面干净可用。
#
#        想恢复严格校验: 去掉下一行行首的 '#', 同时在
#        /etc/opkg/distfeeds.conf 里注释掉三条 iStoreOS 源即可(官方源签名正常)。
# =============================================================================
dest root /
dest ram /tmp
lists_dir ext /var/opkg-lists
option overlay_root /overlay

#option check_signature

# 架构表: 本机 aarch64_generic; aarch64_cortex-a53 供 iStoreOS 的 nas 源使用
arch all 1
arch noarch 1
arch aarch64_generic 10
arch aarch64_cortex-a53 5
