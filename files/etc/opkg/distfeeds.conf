# =============================================================================
#  opkg 软件源 —— 随固件内置, 刷完即可用「系统 → 软件包」
#  分两组:
#    1) ImmortalWrt 24.10.0 官方包(CERNET 镜像)
#    2) iStoreOS 系 (linkease 官方二进制仓库: iStore 商店 / NAS 套件)
#  内核模块(kmods): 本固件内核 6.6.99 为 fork 自编, 与官方 6.6.86 系列 vermagic
#  不一致, 装了会报 kernel version mismatch, 故未启用; 需要请在构建时选入。
# =============================================================================

# ---- ImmortalWrt 24.10.0 (CERNET 镜像) ----
src/gz immortalwrt_core https://mirrors.cernet.edu.cn/immortalwrt/releases/24.10.0/targets/rockchip/armv8/packages
src/gz immortalwrt_base https://mirrors.cernet.edu.cn/immortalwrt/releases/24.10.0/packages/aarch64_generic/base
src/gz immortalwrt_luci https://mirrors.cernet.edu.cn/immortalwrt/releases/24.10.0/packages/aarch64_generic/luci
src/gz immortalwrt_packages https://mirrors.cernet.edu.cn/immortalwrt/releases/24.10.0/packages/aarch64_generic/packages
src/gz immortalwrt_routing https://mirrors.cernet.edu.cn/immortalwrt/releases/24.10.0/packages/aarch64_generic/routing
src/gz immortalwrt_telephony https://mirrors.cernet.edu.cn/immortalwrt/releases/24.10.0/packages/aarch64_generic/telephony

# ---- iStoreOS 系 (linkease 官方仓库, 即 iStore 商店的包源) ----
#
# 这三个源的 Packages.sig 由未公开的 key 1d15e401c11b3e0f 签名, 本机 /etc/opkg/keys
# 里只有 a56f16274c6d486b(仅能验证 all/compat), 所以启用签名校验时它们必然报
# "Signature check failed"(列表仍会下载)。
# 首次启动脚本 99-opkg-istore 的处理: 检测到签名失败 -> 把 /etc/opkg.conf 里的
# `option check_signature` 注释掉(等价关闭校验)后重试一次, 日志见 /etc/opkg-boot.log。
# 想恢复对所有源的严格校验: 编辑 /etc/opkg.conf 恢复 `option check_signature`,
# 并把下面三行 iStoreOS 源注释掉即可(或接受这三条告警)。
#
src/gz istore_store https://istore.istoreos.com/repo/all/store
src/gz istore_nas_luci https://istore.istoreos.com/repo/all/nas_luci
src/gz istore_nas https://istore.istoreos.com/repo/aarch64_cortex-a53/nas

# iStore 的 nas 源按 aarch64_cortex-a53 编译(与本机 aarch64_generic 兼容),
# 首次启动会自动在 /etc/opkg.conf 保证架构表包含: aarch64_cortex-a53 5
#
# 签名说明: 官方 Packages.sig 由 key 1d15e401c11b3e0f 签名, 但该公钥未公开
# (仓库根目录只放了 a56f16274c6d486b, 与本目录 /etc/opkg/keys/ 里那把一致)。
# 首次启动会尝试 opkg update; 若报 "Signature check failed", 会自动关闭
# 签名校验(option check_signature 0)并重试一次, 过程记录在 /etc/opkg-boot.log。
#
# 以下为注释掉的官方 kmods 源(需与内核版本一致才可用):
# src/gz immortalwrt_kmods https://downloads.immortalwrt.org/releases/24.10.1/targets/rockchip/armv8/kmods/6.6.86-1-422144fea623288f7402e1a9a15724c8/
